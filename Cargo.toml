[package]
name = "blackscholes"
version = "0.1.0"
edition = "2024"
description = "Black-Scholes price, implied volatility and greeks, a port of Go sf8193/blackscholes v1.1.0"
license = "MIT"
repository = "https://github.com/sf8193/blackscholes-rs"

[dependencies]
libm = "0.2.16"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
